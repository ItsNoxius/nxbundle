name: Publish to npm

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --allow-same-version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - run: npm ci

      - name: Publish to npm
        run: npx npm@latest publish
